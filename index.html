<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0b2545" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StatSkill AI" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <title>StatSkill AI - Competency Intelligence Platform | India's Official Statistical System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // 1. Immediate Service Worker registration at 0ms (Prerequisite for Chrome Web Install Prompt)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          console.log('[PWA SW] Immediate 0ms registration successful:', reg.scope);
        }).catch(function(err) {
          console.warn('[PWA SW] Registration error:', err);
        });
      }

      // 2. Immediate capture of native browser web install prompt
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        console.log('[PWA] Native web install prompt captured successfully');
        window.dispatchEvent(new CustomEvent('pwa-prompt-captured'));
      });

      window.addEventListener('appinstalled', function() {
        window.deferredPWAInstallPrompt = null;
        console.log('[PWA] Application installed on device');
        window.dispatchEvent(new CustomEvent('pwa-app-installed'));
      });
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased min-h-screen overflow-x-hidden w-full">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b2545;color:#ffffff;font-family:system-ui,-apple-system,sans-serif;">
        <div style="width:64px;height:64px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
          <svg viewBox="0 0 48 48" style="width:64px;height:64px;" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0f2b5c" />
                <stop offset="50%" stop-color="#0b1b36" />
                <stop offset="100%" stop-color="#040b17" />
              </linearGradient>
              <linearGradient id="splashGold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffb703" />
                <stop offset="100%" stop-color="#fb8500" />
              </linearGradient>
              <linearGradient id="splashCyan" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#0284c7" />
                <stop offset="50%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#a5f3fc" />
              </linearGradient>
              <linearGradient id="splashEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#10b981" />
                <stop offset="100%" stop-color="#059669" />
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#splashBg)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
            <path d="M 14 3 Q 3 3 3 14" stroke="url(#splashGold)" stroke-width="2.5" stroke-linecap="round" />
            <path d="M 34 45 Q 45 45 45 34" stroke="url(#splashEmerald)" stroke-width="2.5" stroke-linecap="round" />
            <rect x="10" y="27" width="4.5" height="11" rx="2" fill="url(#splashCyan)" opacity="0.75" />
            <rect x="17" y="21" width="4.5" height="17" rx="2" fill="url(#splashCyan)" opacity="0.9" />
            <rect x="24" y="15" width="4.5" height="23" rx="2" fill="url(#splashCyan)" />
            <rect x="31" y="10" width="4.5" height="28" rx="2" fill="url(#splashGold)" />
            <path d="M 12 26 C 18 20, 24 14, 33 9.5" stroke="url(#splashGold)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3" />
            <circle cx="33.25" cy="9.5" r="3" fill="#ffffff" />
            <circle cx="33.25" cy="9.5" r="1.8" fill="#fb8500" />
          </svg>
        </div>
        <div style="font-size:20px;font-weight:700;letter-spacing:0.5px;margin-bottom:4px;">StatSkill AI</div>

        <div style="width:32px;height:32px;border:3px solid rgba(255,255,255,0.15);border-top-color:#fb8500;border-radius:50%;animation:spin 0.8s linear infinite;"></div>

    </div>
    <script type="module" src="/src/main.jsx"></script>
